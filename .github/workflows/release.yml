name: Release

# Push a tag such as v1.0.0 to publish Resonance-win-x64.zip as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        shell: pwsh
        run: ./publish.ps1 -Destination "$env:RUNNER_TEMP\Resonance" -Zip -NoShortcut
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME publish/Resonance-win-x64.zip --title "Resonance $env:GITHUB_REF_NAME" --generate-notes
