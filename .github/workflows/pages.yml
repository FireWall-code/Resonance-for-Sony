name: Website

# Publishes the site/ folder with GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      # Tells search engines that support IndexNow, such as Bing, that the pages changed.
      - name: Notify IndexNow
        continue-on-error: true
        run: |
          curl -sS -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json" -d '{
            "host": "firewall-code.github.io",
            "key": "f117e39b5c4baedb434f7ef515ab9188",
            "keyLocation": "https://firewall-code.github.io/Resonance-for-Sound-Connect/f117e39b5c4baedb434f7ef515ab9188.txt",
            "urlList": ["https://firewall-code.github.io/Resonance-for-Sound-Connect/", "https://firewall-code.github.io/Resonance-for-Sound-Connect/fr/", "https://firewall-code.github.io/Resonance-for-Sound-Connect/llms.txt"]
          }'
